plugins {
    id 'war'
    id 'application'
}

group = 'gator.apps'
version = '0.1.0'

java {
    toolchain { languageVersion = JavaLanguageVersion.of(21) }
}

repositories {
    mavenCentral()
}

configurations { sharedErrorPages }

dependencies {
    implementation 'gator.lib:gator-lib:1.0.0-SNAPSHOT'
    implementation 'gator.lib:gator-lib-web:1.0.0-SNAPSHOT'
    implementation 'gator.lib:gator-lib-web-gui:1.0.0-SNAPSHOT'
    sharedErrorPages('gator.lib:gator-lib-web-resources:1.0.0-SNAPSHOT') { transitive = false }
    implementation 'org.eclipse.angus:angus-mail:2.0.4'
    implementation 'org.postgresql:postgresql:42.7.10'
    implementation 'com.googlecode.owasp-java-html-sanitizer:owasp-java-html-sanitizer:20260313.1'
    implementation 'org.commonmark:commonmark:0.28.0'
    providedCompile 'jakarta.servlet:jakarta.servlet-api:6.1.0'
}

application {
    mainClass = 'gator.mail.filter.MailFilterService'
    applicationName = 'gator-mail-filter'
}

tasks.withType(JavaCompile).configureEach { options.encoding = 'UTF-8' }

tasks.named('war') {
    dependsOn configurations.sharedErrorPages
    webAppDirectory = file('web')
    // Mail needs the shared error presentation, without exposing the other applications' JSP endpoints.
    from({ zipTree(configurations.sharedErrorPages.singleFile) }) {
        include 'META-INF/resources/errors/access-error.jspf'
        eachFile { path = 'errors/access-error.jspf' }
        includeEmptyDirs = false
    }
    from({ zipTree(configurations.sharedErrorPages.singleFile) }) {
        include 'META-INF/resources/assets/gator-scanner-v01.js', 'META-INF/resources/assets/gator-scanner-v01.css'
        eachFile { path = 'assets/' + name }
        includeEmptyDirs = false
    }
    archiveFileName = 'gator-mail.war'
    destinationDirectory = file('dist')
}

tasks.register('selfTest', JavaExec) {
    dependsOn testClasses
    classpath = sourceSets.test.runtimeClasspath
    mainClass = 'gator.mail.AccessCodeSelfCheck'
    environment 'GATOR_MAIL_OAUTH_ISSUER', 'https://identity.example/realms/test'
    enableAssertions = true
    if (project.hasProperty('uiFixtureDir')) args project.property('uiFixtureDir')
}

tasks.register('filterSelfTest', JavaExec) {
    dependsOn testClasses
    classpath = sourceSets.test.runtimeClasspath
    mainClass = 'gator.mail.filter.MailFilterSelfCheck'
    enableAssertions = true
}

tasks.register('webSelfTest') {
    def scriptFile = layout.projectDirectory.file('web/js/gator-mail.js')
    inputs.file(scriptFile)
    doLast {
        def script = scriptFile.asFile.getText('UTF-8')
        assert script.contains('mobileChallenge.getAttribute("action")')
        assert !script.contains('mobileChallenge.action ||')
    }
}

tasks.named('test') { failOnNoDiscoveredTests = false }
tasks.named('check') { dependsOn selfTest, filterSelfTest, webSelfTest }
tasks.named('clean') { delete 'dist' }

// Browser-independent checks for account-scoped appearance preferences.
tasks.register('appearanceTest', Exec) {
    commandLine 'node', 'src/test/web/appearance_test.js'
}
tasks.named('check') { dependsOn appearanceTest }

// Keep this guard local: Mail also builds from an independent checkout.
tasks.register('verifyNoShiro') {
    def runtime = configurations.named('runtimeClasspath')
    inputs.files(runtime)
    doLast {
        def legacy = runtime.get().files.findAll { it.name.toLowerCase(Locale.ROOT).contains('shiro') }
        if (legacy) throw new GradleException("Shiro dependencies remain: ${legacy*.name}")
    }
}
tasks.named('check') { dependsOn 'verifyNoShiro' }
tasks.named('war') { dependsOn 'verifyNoShiro' }

// Exercise token rotation and recovery against an isolated local HTTPS provider.
tasks.register('oauthRefreshSelfTest', JavaExec) {
    dependsOn testClasses
    classpath = sourceSets.test.runtimeClasspath
    mainClass = 'gator.mail.OAuthRefreshSelfCheck'
    enableAssertions = true
    doFirst {
        def socket = new java.net.ServerSocket(0)
        def testPort = socket.localPort
        socket.close()
        environment 'GATOR_MAIL_OAUTH_ISSUER', "https://localhost:${testPort}/realms/test"
    }
}
tasks.named('check') { dependsOn oauthRefreshSelfTest }
